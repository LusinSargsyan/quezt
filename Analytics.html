<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quezt — Analytics</title>
<meta name="description" content="Quezt — no-code gamification for business. MVP screen: 7 · Analytics.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@600&f[]=satoshi@400,500,700,900&f[]=general-sans@500,600&display=swap">
<link rel="stylesheet" href="quezt.css">
<link rel="stylesheet" href="site.css">

</head>
<body class="page-full">
<a class="skip" href="#qz-root">Skip to content</a>
<a class="home-link" href="index.html" aria-label="All Quezt screens"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>All screens</a>
<div id="qz-root" class="full"></div>
<template id="qz-tpl">

<div class="qz {{theme}}" style="min-height: 1000px; display: flex; flex-wrap: wrap;">
  <div style="flex: 1 1 240px;"><dc-import name="Sidebar" active="analytics" env="production" dark="{{dark}}" hint-size="100%,1000px"></dc-import></div>
  <main style="flex: 999 1 560px; min-width: 0; padding: 32px; display: flex; flex-direction: column; gap: 24px; max-width: 1200px;">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 12px;"><h1 class="h1">Analytics</h1><span class="chip chip-live">Production</span></div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <select class="input" aria-label="Campaign" style="width: 180px;"><option>Daily missions</option></select>
        <div class="seg" role="group" aria-label="Period"><span>7 d</span><span class="on">30 d</span><span>90 d</span></div>
      </div>
    </div>

    <section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;" aria-label="Summary">
      <div class="card"><span class="caption">PLAYERS IN WIDGET · DAILY AVG</span><p class="kpi">684</p></div>
      <div class="card"><span class="caption">MISSION COMPLETION</span><p class="kpi">62%</p></div>
      <div class="card"><span class="caption">BADGE UNLOCK RATE</span><p class="kpi">38%</p></div>
      <div class="card"><span class="caption">COUPONS REDEEMED</span><p class="kpi">54 <span class="muted" style="font-size: 16px; font-family: var(--font-body);">/ 112 issued</span></p></div>
    </section>

    <section class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 16px;" aria-labelledby="dau">
      <div style="display: flex; justify-content: space-between; align-items: baseline;"><h2 class="title" id="dau">Players in widget per day</h2><span class="caption">Sample data · Asia/Yerevan</span></div>
      <div role="img" aria-label="Daily players over 30 days, rising from about 450 to about 820" style="height: 200px; display: flex; align-items: flex-end; gap: 4px; border-bottom: 1px solid var(--border-default);">
        <template data-sc="for" list="{{bars}}" as="b" hint-placeholder-count="30"><span style="flex: 1; height: {{b.h}}; border-radius: 4px 4px 0 0; background: var(--accent); opacity: {{b.o}};"></span></template>
      </div>
      <div style="display: flex; justify-content: space-between;" class="caption"><span>Oct 18</span><span>Nov 1</span><span>Nov 16</span></div>
    </section>

    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start;">
      <section class="card" style="flex: 999 1 380px; min-width: 0; padding: 20px; display: flex; flex-direction: column; gap: 16px;" aria-labelledby="fun">
        <h2 class="title" id="fun">Mission funnel · "Play 5 rounds"</h2>
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <div style="display: flex; flex-direction: column; gap: 4px;"><div style="display: flex; justify-content: space-between;"><span>Saw mission</span><b>2,184</b></div><div class="bar" style="height: 12px;"><span style="width: 100%;"></span></div></div>
          <div style="display: flex; flex-direction: column; gap: 4px;"><div style="display: flex; justify-content: space-between;"><span>Started (1+ round)</span><b>1,746 · 80%</b></div><div class="bar" style="height: 12px;"><span style="width: 80%;"></span></div></div>
          <div style="display: flex; flex-direction: column; gap: 4px;"><div style="display: flex; justify-content: space-between;"><span>Halfway (3 rounds)</span><b>1,572 · 72%</b></div><div class="bar" style="height: 12px;"><span style="width: 72%;"></span></div></div>
          <div style="display: flex; flex-direction: column; gap: 4px;"><div style="display: flex; justify-content: space-between;"><span>Completed</span><b>1,354 · 62%</b></div><div class="bar" style="height: 12px;"><span style="width: 62%;"></span></div></div>
        </div>
      </section>

      <section class="card" style="flex: 1 1 320px; padding: 0;" aria-labelledby="bdg">
        <h2 class="title" id="bdg" style="padding: 20px 20px 8px;">Badges</h2>
        <div class="table-box"><table class="table">
          <thead><tr><th>Badge</th><th>Unlocked</th><th>Rate</th></tr></thead>
          <tbody>
            <tr><td>Getting started</td><td>1,820</td><td>83%</td></tr>
            <tr><td>3-day streak</td><td>702</td><td>32%</td></tr>
            <tr><td>7-day streak</td><td>241</td><td>11%</td></tr>
            <tr><td>Explorer</td><td>96</td><td>4%</td></tr>
          </tbody>
        </table></div>
      </section>
    </div>

    <div class="banner banner-info">
      <svg class="icon icon-20" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--accent);"><path d="M12 3l1.8 4.7L18.5 9.5 13.8 11.3 12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 2px;"><b>AI insights come after the pilot</b><span class="muted">They need 30+ days of real data (ADR-045).</span></div>
    </div>
  </main>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const vals = [450,470,462,498,520,505,540,560,548,575,590,610,600,628,640,652,670,662,690,700,715,708,730,745,760,752,778,790,805,820];
    return {
      dark, theme: dark ? 'dark' : '',
      bars: vals.map((v, i) => ({ h: Math.round(v / 820 * 100) + '%', o: i === vals.length - 1 ? 1 : 0.75 }))
    };
  }
}
</script>
<script src="dc.js"></script>
</body>
</html>
