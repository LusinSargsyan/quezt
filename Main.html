<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quezt — Onboarding</title>
<meta name="description" content="Quezt — no-code gamification for business. MVP screen: 1 · Onboarding.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@600&display=swap">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600&display=swap">
<link rel="stylesheet" href="quezt.css">
<link rel="stylesheet" href="player.css">
<link rel="stylesheet" href="site.css">

</head>
<body class="page-full">
<a class="skip" href="#qz-root">Skip to content</a>
<div id="qz-root" class="full"></div>
<template id="qz-tpl">

<div class="qz {{theme}}" style="min-height: 1000px; display: flex; flex-direction: column;">
  <header style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 16px 32px; border-bottom: 1px solid var(--border-default); background: var(--bg-surface);">
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="var(--accent)"></rect><path d="M9 14a5 5 0 1 0 10 0a5 5 0 1 0-10 0M17 17l3 3" stroke="var(--on-accent)" stroke-width="2.2" fill="none" stroke-linecap="round"></path></svg>
      <span class="display" style="font-size: 20px;">Quezt</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <span class="caption">Setup checklist</span>
      <span class="chip chip-ai">2 of 5 done</span>
      <a class="btn btn-ghost btn-sm" href="Overview.html">Skip to dashboard</a>
    </div>
  </header>

  <main style="flex: 1; width: 100%; max-width: 1360px; margin: 0 auto; padding: 32px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start;">
    <!-- Checklist -->
    <aside class="card" style="flex: 1 1 240px; max-width: 280px; display: flex; flex-direction: column; gap: 4px; padding: 16px;" aria-label="Setup steps">
      <p class="caption" style="padding: 0 8px 8px;">GET LIVE IN 5 STEPS</p>
      <div style="display: flex; gap: 12px; align-items: center; padding: 10px 8px;"><span class="check" style="background: var(--success); color: var(--bg-surface);"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span><span>Website + brand</span></div>
      <div style="display: flex; gap: 12px; align-items: center; padding: 10px 8px;"><span class="check" style="background: var(--success); color: var(--bg-surface);"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span><span>Template</span></div>
      <div style="display: flex; gap: 12px; align-items: center; padding: 10px 8px; border-radius: 10px; background: var(--accent-subtle); color: var(--accent); font-weight: 600;"><span class="check" style="border: 2px solid var(--accent);">3</span><span>Preview + consent</span></div>
      <div style="display: flex; gap: 12px; align-items: center; padding: 10px 8px;" class="muted"><span class="check" style="border: 2px solid var(--border-input);">4</span><span>Connect (snippet, API, Shopify)</span></div>
      <div style="display: flex; gap: 12px; align-items: center; padding: 10px 8px;" class="muted"><span class="check" style="border: 2px solid var(--border-input);">5</span><span>Publish to Production</span></div>
    </aside>

    <!-- Form -->
    <section style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 24px;">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <h1 class="h1">Your widget, on your brand</h1>
        <p class="muted" style="font-size: 16px; line-height: 24px;">We read your homepage once: logo, colors, fonts. Nothing is stored after setup.</p>
      </div>

      <div class="card" style="display: flex; flex-direction: column; gap: 16px; padding: 20px;">
        <div>
          <label class="label" for="url">Website URL</label>
          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <input class="input" id="url" type="url" value="{{site}}" style="flex: 1 1 240px; width: auto;">
            <button class="btn btn-secondary" type="button">Re-import</button>
          </div>
        </div>
        <div style="display: flex; gap: 24px; flex-wrap: wrap; align-items: center; padding: 12px 16px; border-radius: 10px; background: var(--bg-canvas); border: 1px solid var(--border-default);">
          <div style="display: flex; align-items: center; gap: 12px;"><span class="caption">Logo</span><span class="caption" style="min-width: 64px; height: 36px; padding: 4px 12px; border-radius: 6px; border: 1px dashed var(--border-input); background: var(--bg-surface); display: inline-flex; align-items: center; justify-content: center"><template data-sc="if" value="{{logo}}"><img src="{{logo}}" alt="{{brandName}} logo" style="max-height: 28px; max-width: 110px; object-fit: contain;" onerror="this.replaceWith('[logo]')"></template><template data-sc="if" value="{{noLogo}}">[logo]</template></span></div>
          <div style="display: flex; align-items: center; gap: 8px;"><span class="caption">Colors</span><span class="swatch" style="background: {{brand}};"></span><span class="swatch" style="background: {{c2}};"></span><span class="swatch" style="background: {{c3}};"></span></div>
          <div style="display: flex; align-items: center; gap: 8px;"><span class="caption">Font</span><span style="font-weight: 600;">{{font}}</span></div>
          <span class="chip {{cCls}}"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="{{cIcon}}"></path></svg>{{cText}}</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px;">
        <h2 class="title">Pick a template</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px;">
          <div class="card" style="display: flex; flex-direction: column; gap: 6px;"><span class="title" style="font-size: 16px;">Onboarding</span><span class="muted">Profile → first key action → invite a friend</span><span class="caption">XP per step + "Getting started" badge</span></div>
          <div class="card" style="display: flex; flex-direction: column; gap: 6px; border: 2px solid var(--accent); background: var(--accent-subtle);"><span style="display: flex; justify-content: space-between; align-items: center;"><span class="title" style="font-size: 16px;">Daily missions</span><span class="chip chip-ai">Suggested</span></span><span class="muted">3 small tasks a day, local-time reset</span><span class="caption">XP + 3/7-day streak badge, 1 grace day</span></div>
          <div class="card" style="display: flex; flex-direction: column; gap: 6px;"><span class="title" style="font-size: 16px;">Loyalty</span><span class="muted">XP from purchases or key actions</span><span class="caption">Levels L1–L3, each unlocks a coupon</span></div>
        </div>
      </div>

      <div class="card" style="display: flex; flex-direction: column; gap: 12px; padding: 20px;">
        <label class="label" for="prompt" style="display: flex; align-items: center; gap: 8px; margin: 0;"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5 13.8 11.3 12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"></path></svg>Or describe your goal</label>
        <textarea class="input" id="prompt" rows="2">Bring players back every day for the first 2 weeks</textarea>
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
          <span class="help" style="margin: 0;">AI drafts events, rules, missions and badges. You review before anything goes live. 18 of 20 AI drafts left this month.</span>
          <button class="btn btn-secondary btn-sm" type="button">Draft with AI</button>
        </div>
      </div>

      <div class="card" style="display: flex; gap: 12px; align-items: flex-start;">
        <input type="checkbox" id="consent" checked="" style="width: 20px; height: 20px; margin: 0; accent-color: var(--accent);">
        <label for="consent" style="display: flex; flex-direction: column; gap: 2px;"><span style="font-weight: 600;">I confirm we have consent from our players</span><span class="muted">Quezt only stores an external player ID. No names or emails.</span></label>
      </div>

      <div style="display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap;">
        <button class="btn btn-ghost" type="button">Back</button>
        <a class="btn btn-primary" href="Overview.html">Continue to connect</a>
      </div>
    </section>

    <!-- Live preview -->
    <aside style="flex: 1 1 340px; max-width: 380px; display: flex; flex-direction: column; gap: 12px;" aria-label="Live preview">
      <div style="display: flex; justify-content: space-between; align-items: center;"><span class="caption">LIVE PREVIEW · SAMPLE PLAYER</span><span class="chip chip-test">Test</span></div>
      <div style="position: relative; height: 560px; border-radius: 16px; border: 1px solid var(--border-default); background: #f4f3f7; overflow: hidden;">
          <div aria-hidden="true" style="position: absolute; inset: 0; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; justify-content: space-between; align-items: center;"><span style="font-weight: 700; font-size: 12px; color: #5e5b6b;">{{siteHost}}</span><span style="width: 80px; height: 8px; border-radius: 4px; background: #dcd9e4;"></span></div>
            <div style="height: 120px; border-radius: 10px; background: #e2e0e8;"></div>
            <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;"><div style="height: 70px; border-radius: 8px; background: #e9e7ee;"></div><div style="height: 70px; border-radius: 8px; background: #e9e7ee;"></div><div style="height: 70px; border-radius: 8px; background: #e9e7ee;"></div></div>
          </div>
          <div class="qp" style="--qz-w-brand: {{brand}}; --qz-w-on-brand: {{onBrand}}; font-family: {{wfont}}; position: absolute; right: 16px; bottom: 16px; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; background: transparent;">
            <section role="dialog" aria-label="Rewards preview" style="position: relative; width: 300px; max-width: calc(100% - 0px); background: var(--qz-w-surface); border-radius: 24px; box-shadow: var(--shadow-panel); display: flex; flex-direction: column;">
              <span aria-hidden="true" style="position: absolute; right: 40px; bottom: -7px; width: 16px; height: 16px; background: var(--qz-w-surface); transform: rotate(45deg); border-radius: 3px;"></span>
              <header style="display: flex; justify-content: space-between; align-items: center; padding: 12px 10px 6px 16px;">
                <span style="font-weight: 800; font-size: 15px;">{{brandName}} Rewards</span>
                <span style="display: flex; gap: 6px; align-items: center;"><span class="qp-chip qp-chip-xp" style="height: 26px;">1,240 pts</span><span class="qp-icon-btn" aria-hidden="true" style="min-width: 36px; height: 36px; padding: 0;"><svg class="qp-ico" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M6 6l12 12M18 6L6 18"></path></svg></span></span>
              </header>
              <div style="padding: 4px 12px 14px; display: flex; flex-direction: column; gap: 8px;">
                <div class="qp-tabs" style="padding: 3px;"><span class="qp-tab is-on" style="height: 32px; font-size: 13px;">Missions</span><span class="qp-tab" style="height: 32px; font-size: 13px;">Badges</span><span class="qp-tab" style="height: 32px; font-size: 13px;">Ranks</span></div>
                <div style="background: var(--qz-w-brand); color: var(--qz-w-on-brand); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 6px;">
                  <div style="display: flex; justify-content: space-between; align-items: baseline;"><span class="qp-display" style="font-size: 22px; line-height: 26px;">Level 2</span><b class="qp-num" style="font-size: 16px;">240 / 500 XP</b></div>
                  <div style="height: 8px; border-radius: 999px; background: rgba(255,255,255,.22); overflow: hidden;"><span style="display: block; width: 48%; height: 100%; border-radius: 999px; background: var(--qz-w-cta);"></span></div>
                  <span style="opacity: .9; font-size: 13px;">260 XP to Level 3 → coupon</span>
                </div>
                <div class="qp-card qp-row" style="padding: 10px 12px; gap: 8px;"><span style="flex: 1; display: flex; flex-direction: column;"><b style="font-size: 14px;">Play 5 rounds</b><span class="qp-muted" style="font-size: 12px;">3 / 5 · resets at midnight</span></span><span class="qp-chip qp-chip-xp" style="height: 24px;">+50 XP</span></div>
                <div class="qp-card qp-row" style="padding: 10px 12px; gap: 8px;"><span style="flex: 1; display: flex; flex-direction: column;"><b style="font-size: 14px;">Try a new game</b><span class="qp-muted" style="font-size: 12px;">0 / 1</span></span><span class="qp-chip qp-chip-xp" style="height: 24px;">+50 XP</span></div>
                <span class="qp-btn qp-btn-sm" style="margin-top: 2px;">See all rewards</span>
              </div>
            </section>
            <span class="qp-btn qp-btn-brand" style="height: 48px; padding: 0 18px 0 14px; font-size: 14px; box-shadow: var(--shadow-glow);"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>Rewards · 1,240 pts</span>
          </div>
      </div>
      <p class="help">Preview runs before any integration. Edit colors anytime in Theme studio (every plan, incl. Free).</p>
    </aside>
  </main>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"site":{"editor":"text","default":"https://yourbrand.com"},"logo":{"editor":"text","default":""},"c2":{"editor":"text","default":"#18171f"},"c3":{"editor":"text","default":"#f7f6fa"},"font":{"editor":"text","default":"Satoshi"},"brandName":{"editor":"text","default":"Your Brand"},"brand":{"editor":"color","default":"#6D4DFF","options":["#6D4DFF","#0F766E","#1D4ED8","#B42318"]},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const p = this.props, brand = p.brand ?? '#6D4DFF';
    const lum = (hex) => { const h = (hex || '#6D4DFF').replace('#', ''); return [0, 2, 4].map((i) => parseInt(h.substr(i, 2), 16) / 255).map((v) => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)).reduce((a, v, i) => a + v * [0.2126, 0.7152, 0.0722][i], 0); };
    const ratio = Math.round(1.05 / (lum(brand) + 0.05) * 10) / 10, pass = ratio >= 4.5;
    const font = p.font || 'Satoshi';
    return { theme: dark ? 'dark' : '', wtheme: '', brand, site: p.site || 'https://yourbrand.com', logo: p.logo || '', noLogo: !p.logo,
      c2: p.c2 || '#18171f', c3: p.c3 || '#f7f6fa', font, brandName: p.brandName || 'Your Brand', siteHost: (p.site || 'yourbrand.com').replace(/^https?:\/\//, '').replace(/\/.*$/, '').replace(/^www\./, ''), onBrand: lum(brand) > 0.4 ? '#0F0E17' : '#FFFFFF',
      wfont: '"' + font + '", "Satoshi", "Noto Sans", system-ui, sans-serif',
      cCls: pass ? 'chip-live' : 'chip-err', cText: pass ? 'Contrast AA ' + ratio + ':1' : ratio + ':1 on white — pick a darker shade in Theme studio',
      cIcon: pass ? 'M5 12l5 5 9-10' : 'M12 8v5M12 16h.01' };
  }
}
</script>
<script src="dc.js"></script>
<script src="interact.js"></script>
</body>
</html>
