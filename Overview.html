<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quezt — Overview</title>
<meta name="description" content="Quezt — no-code gamification for business. MVP screen: 2 · Overview.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@600&display=swap">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600&display=swap">
<link rel="stylesheet" href="quezt.css">
<link rel="stylesheet" href="site.css">

</head>
<body class="page-full">
<a class="skip" href="#qz-root">Skip to content</a>
<a class="home-link" href="index.html" aria-label="All Quezt screens"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>All screens</a>
<div id="qz-root" class="full"></div>
<template id="qz-tpl">

<div class="qz {{theme}}" style="min-height: 1000px; display: flex; flex-wrap: wrap;">
  <div style="flex: 1 1 240px;"><dc-import name="Sidebar" active="overview" dark="{{dark}}" hint-size="100%,1000px"></dc-import></div>
  <main style="flex: 999 1 560px; min-width: 0; padding: 32px; display: flex; flex-direction: column; gap: 24px; max-width: 1200px;">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 12px;"><h1 class="h1">Overview</h1><span class="chip chip-test">Test</span></div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <a class="btn btn-secondary" href="Theme.html">Edit theme</a>
        <a class="btn btn-primary" href="Editor.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New campaign</a>
      </div>
    </div>

    <!-- Setup checklist: open by default, with a count (ADR-049) -->
    <section class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 16px;" aria-labelledby="setup">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;">
        <div style="display: flex; flex-direction: column; gap: 4px;"><h2 class="title" id="setup">Finish setup · 3 of 5</h2><span class="muted">You're one connection away from real players.</span></div>
        <div class="bar" style="width: 200px;"><span style="width: 60%;"></span></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px;">
        <div style="display: flex; gap: 10px; align-items: center;"><span class="check" style="background: var(--success); color: var(--bg-surface);"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span><span>Brand imported</span></div>
        <div style="display: flex; gap: 10px; align-items: center;"><span class="check" style="background: var(--success); color: var(--bg-surface);"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span><span>Campaign drafted</span></div>
        <div style="display: flex; gap: 10px; align-items: center;"><span class="check" style="background: var(--success); color: var(--bg-surface);"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span><span>Player consent confirmed</span></div>
        <div style="display: flex; gap: 10px; align-items: center; font-weight: 600; color: var(--accent);"><span class="check" style="border: 2px solid var(--accent);">4</span><a href="Settings.html">Install snippet</a></div>
        <div style="display: flex; gap: 10px; align-items: center;" class="muted"><span class="check" style="border: 2px solid var(--border-input);">5</span><span>Publish to Production</span></div>
      </div>
    </section>

    <!-- KPIs -->
    <section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;" aria-label="Key numbers (Test, last 7 days)">
      <div class="card" style="display: flex; flex-direction: column; gap: 4px;"><span class="caption">ACTIVE PLAYERS · 7 D</span><span class="kpi">412</span><span class="caption" style="color: var(--success);">Test sample data</span></div>
      <div class="card" style="display: flex; flex-direction: column; gap: 4px;"><span class="caption">MISSIONS COMPLETED</span><span class="kpi">1,086</span><span class="caption">62% completion</span></div>
      <div class="card" style="display: flex; flex-direction: column; gap: 4px;"><span class="caption">BADGES UNLOCKED</span><span class="kpi">238</span><span class="caption">Top: Getting started</span></div>
      <div class="card" style="display: flex; flex-direction: column; gap: 4px;"><span class="caption">COUPONS REDEEMED</span><span class="kpi">54</span><span class="caption">Budget 54 / 500</span></div>
    </section>

    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start;">
      <section class="card" style="flex: 999 1 420px; min-width: 0; padding: 0;" aria-labelledby="ac">
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px;"><h2 class="title" id="ac">Campaigns</h2><a href="Campaigns.html">View all</a></div>
        <div class="table-box"><table class="table">
          <thead><tr><th>Campaign</th><th>Status</th><th>Players</th><th>Ends</th></tr></thead>
          <tbody>
            <tr><td style="font-weight: 600;">Daily missions</td><td><span class="chip chip-test">In Test</span></td><td>412</td><td>No end date</td></tr>
            <tr><td style="font-weight: 600;">Welcome quest</td><td><span class="chip">Draft</span></td><td>—</td><td>Dec 31</td></tr>
          </tbody>
        </table></div>
      </section>

      <section style="flex: 1 1 300px; display: flex; flex-direction: column; gap: 16px;">
        <div class="card" style="display: flex; flex-direction: column; gap: 12px;">
          <h2 class="title">Integration</h2>
          <div style="display: flex; align-items: center; gap: 8px;"><span class="dot" style="background: var(--warning);"></span><span>Waiting for your first event</span></div>
          <p class="muted">Install the snippet, then send <span class="mono">Quezt.track("signup")</span>. This turns green when it arrives.</p>
          <a class="btn btn-secondary btn-sm" href="Settings.html" style="align-self: flex-start;">Open install guide</a>
        </div>
        <div class="card" style="display: flex; flex-direction: column; gap: 12px;">
          <h2 class="title">Recent activity</h2>
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; justify-content: space-between; gap: 8px;"><span><b>Lucky Fox 42</b> completed "Play 5 rounds"</span><span class="caption">2 min</span></div>
            <div style="display: flex; justify-content: space-between; gap: 8px;"><span><b>Blue Owl 7</b> earned "3-day streak"</span><span class="caption">9 min</span></div>
            <div style="display: flex; justify-content: space-between; gap: 8px;"><span><b>Lusine</b> edited Daily missions</span><span class="caption">1 h</span></div>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    return { dark, theme: dark ? 'dark' : '' };
  }
}
</script>
<script src="dc.js"></script>
</body>
</html>
