<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player · Guest view</title>
<meta name="description" content="Quezt — no-code gamification for business. MVP screen: P1 · Guest view.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@600&f[]=satoshi@400,500,700,900&f[]=general-sans@500,600&display=swap">
<link rel="stylesheet" href="quezt.css">
<link rel="stylesheet" href="player.css">
<link rel="stylesheet" href="site.css">

</head>
<body class="page-stage">
<a class="skip" href="#qz-root">Skip to content</a>
<a class="home-link" href="index.html" aria-label="All Quezt screens"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>All screens</a>
<div id="qz-root" class="stage"></div>
<template id="qz-tpl">

<div class="qp" style="--qz-w-brand: {{brand}}; width: 400px; height: 760px; display: flex; flex-direction: column; background: var(--qz-w-surface); border-radius: 32px; overflow: hidden; box-shadow: var(--shadow-panel);">
  <header style="display: flex; justify-content: space-between; align-items: center; padding: 14px 14px 10px 20px;">
    <span style="font-weight: 800; font-size: 16px;">[Your brand] Rewards</span>
    <span style="display: flex; gap: 6px;">
      <button class="qp-icon-btn" type="button" aria-label="How it works"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6M12 17h.01"></path></svg></button>
      <button class="qp-icon-btn" type="button" aria-label="Close rewards"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </span>
  </header>

  <div style="flex: 1; overflow: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 16px;">
    <section style="position: relative; overflow: hidden; background: var(--qz-w-brand); color: var(--qz-w-on-brand); border-radius: 24px; padding: 24px; min-height: 220px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px;">
      <svg width="220" height="220" viewBox="0 0 220 220" aria-hidden="true" style="position: absolute; right: -50px; top: -40px;"><circle cx="110" cy="110" r="90" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="30"></circle><circle cx="110" cy="110" r="30" fill="var(--qz-w-xp)"></circle><circle cx="40" cy="190" r="10" fill="var(--qz-w-cta)"></circle></svg>
      <span class="qp-label" style="color: var(--qz-w-on-brand); opacity: .85; position: relative;">Free to join</span>
      <h1 class="qp-display" style="font-size: 36px; line-height: 38px; position: relative;">Play. Level up. Get rewards.</h1>
    </section>

    <span class="qp-label">What you can earn</span>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div class="qp-row" style="background: var(--qz-w-tile-violet); color: var(--qz-w-on-tile); border-radius: 20px; padding: 14px;">
        <span style="width: 44px; height: 44px; border-radius: 14px; background: rgba(255,255,255,.18); display: inline-flex; align-items: center; justify-content: center;"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column;"><b style="font-size: 16px;">+50 XP for your first round</b><span style="opacity: .9;">A quick win in 1 minute</span></span>
      </div>
      <div class="qp-row" style="background: var(--qz-w-tile-blue); color: var(--qz-w-on-tile); border-radius: 20px; padding: 14px;">
        <span style="width: 44px; height: 44px; border-radius: 14px; background: rgba(255,255,255,.18); display: inline-flex; align-items: center; justify-content: center;"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c1 3 4 4 4 8a4 4 0 0 1-8 0c0-2 1-3 1-3 0 2 1.5 3 1.5 3S10 7 12 3z"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column;"><b style="font-size: 16px;">Daily missions + streaks</b><span style="opacity: .9;">Miss a day? 1 grace day a week</span></span>
      </div>
      <div class="qp-row" style="background: var(--qz-w-tile-coral); color: var(--qz-w-on-tile); border-radius: 20px; padding: 14px;">
        <span style="width: 44px; height: 44px; border-radius: 14px; background: rgba(255,255,255,.18); display: inline-flex; align-items: center; justify-content: center;"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h18v3H3zM5 12v9h14v-9M12 9v12"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column;"><b style="font-size: 16px;">Level 3 unlocks a coupon</b><span style="opacity: .9;">Reach 500 XP</span></span>
      </div>
    </div>
  </div>

  <footer style="padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 12px; align-items: stretch;">
    <a class="qp-btn" href="PMissions.html" style="height: 52px; font-size: 16px;">Join for free</a>
    <span class="qp-muted" style="text-align: center;">Already a player? <a href="PMissions.html" style="font-weight: 700; text-decoration: underline;">Sign in</a></span>
  </footer>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#6D4DFF","options":["#6D4DFF","#2F6FE8","#C93A47","#0F766E"]},"$preview":{"width":400,"height":760}}'>
class Component extends DCLogic {
  renderVals() { return { brand: this.props.brand ?? '#6D4DFF' }; }
}
</script>
<script src="dc.js"></script>
</body>
</html>
