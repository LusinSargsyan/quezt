<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player · Mobile sheet</title>
<meta name="description" content="Quezt — no-code gamification for business. MVP screen: P5 · Mobile bottom sheet.">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@600&f[]=satoshi@400,500,700,900&f[]=general-sans@500,600&display=swap">
<link rel="stylesheet" href="css/quezt.css">
<link rel="stylesheet" href="css/player.css">
<link rel="stylesheet" href="css/site.css">

</head>
<body class="page-stage">
<a class="skip" href="#qz-root">Skip to content</a>
<a class="home-link" href="index.html" aria-label="All Quezt screens"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>All screens</a>
<div id="qz-root" class="stage"></div>
<template id="qz-tpl">

<div class="qp" style="--qz-w-brand: {{brand}}; width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--qz-w-ground);">
  <!-- Host site (placeholder) -->
  <div aria-hidden="true" style="padding: 20px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; justify-content: space-between; align-items: center;"><span class="qp-muted" style="font-weight: 800;">[Your site]</span><span style="width: 24px; height: 14px; border-top: 2px solid var(--qz-w-muted); border-bottom: 2px solid var(--qz-w-muted);"></span></div>
    <div style="height: 170px; border-radius: 24px; background: var(--qz-w-surface-raised);"></div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
      <div style="height: 130px; border-radius: 20px; background: var(--qz-w-surface-raised);"></div><div style="height: 130px; border-radius: 20px; background: var(--qz-w-surface-raised);"></div>
      <div style="height: 130px; border-radius: 20px; background: var(--qz-w-surface-raised);"></div><div style="height: 130px; border-radius: 20px; background: var(--qz-w-surface-raised);"></div>
    </div>
  </div>

  <template data-sc="if" value="{{closed}}" hint-placeholder-val="{{ false }}">
    <button type="button" class="qp-btn qp-btn-brand" aria-label="Open rewards, 1,240 points, 1 new badge" style="position: absolute; right: 16px; bottom: 28px; height: 56px; padding: 0 22px; box-shadow: var(--shadow-glow);">
      <svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h18v3H3zM5 12v9h14v-9M12 9v12"></path></svg>Rewards · 1,240 pts
      <span aria-hidden="true" style="position: absolute; top: 4px; right: 10px; width: 12px; height: 12px; border-radius: 999px; background: var(--qz-w-cta); border: 2px solid var(--qz-w-brand);"></span>
    </button>
  </template>

  <template data-sc="if" value="{{open}}" hint-placeholder-val="{{ true }}">
    <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(5,3,20,.6);"></div>
    <section role="dialog" aria-label="Rewards" style="position: absolute; left: 0; right: 0; bottom: 0; height: 660px; background: var(--qz-w-surface); border-radius: 32px 32px 0 0; display: flex; flex-direction: column; box-shadow: var(--shadow-panel);">
      <div style="display: flex; justify-content: center; padding: 10px 0 2px;"><span aria-hidden="true" style="width: 44px; height: 5px; border-radius: 999px; background: var(--qz-w-line);"></span></div>
      <header style="display: flex; justify-content: space-between; align-items: center; padding: 6px 12px 10px 20px;">
        <span style="font-weight: 800; font-size: 16px;">[Your brand] Rewards</span>
        <span style="display: flex; gap: 6px; align-items: center;"><span class="qp-chip qp-chip-xp" style="height: 32px;">1,240 pts</span><button class="qp-icon-btn" type="button" aria-label="Close rewards"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span>
      </header>
      <div style="padding: 0 16px;"><nav class="qp-tabs" aria-label="Rewards sections"><a class="qp-tab is-on" href="PMissions.html" aria-current="page">Missions</a><a class="qp-tab" href="PBadges.html">Badges</a><a class="qp-tab" href="PLeaderboard.html">Ranks</a></nav></div>
      <div style="flex: 1; overflow: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;">
        <section style="background: var(--qz-w-brand); color: var(--qz-w-on-brand); border-radius: 24px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px;">
          <div style="display: flex; justify-content: space-between; align-items: baseline;"><span class="qp-display" style="font-size: 28px; line-height: 30px;">Level 2</span><b>290 / 500 XP</b></div>
          <div style="height: 12px; border-radius: 999px; background: rgba(255,255,255,.22); overflow: hidden;"><span style="display: block; width: 58%; height: 100%; border-radius: 999px; background: var(--qz-w-cta);"></span></div>
          <span style="opacity: .9;">210 XP to Level 3 → 10% coupon</span>
        </section>
        <div class="qp-card" style="display: flex; flex-direction: column; gap: 10px; padding: 14px;">
          <div class="qp-row"><span style="flex: 1; display: flex; flex-direction: column;"><b style="font-size: 16px;">Win 2 rounds</b><span class="qp-muted">1 / 2 · resets in 6 h</span></span><span class="qp-chip qp-chip-xp">+80 XP</span></div>
          <div class="qp-bar qp-bar-sm"><span style="width: 50%;"></span></div>
        </div>
        <div class="qp-card qp-row" style="padding: 14px;"><span style="flex: 1; display: flex; flex-direction: column;"><b style="font-size: 16px;">Try a new game</b><span class="qp-muted">0 / 1</span></span><span class="qp-chip qp-chip-xp">+50 XP</span></div>
        <div class="qp-card qp-row" style="padding: 14px;"><span style="flex: 1; display: flex; flex-direction: column;"><b style="font-size: 16px; color: var(--qz-w-streak-ink);">4-day streak</b><span class="qp-muted">1 grace day left this week</span></span><span class="qp-chip qp-chip-streak">Day 5 tomorrow</span></div>
        <a class="qp-btn" href="WHub.html" style="height: 52px;">Open rewards hub</a>
        <button class="qp-btn qp-btn-ghost" type="button">Minimize</button>
      </div>
    </section>
  </template>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#6D4DFF","options":["#6D4DFF","#2F6FE8","#C93A47","#0F766E"]},"open":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const open = this.props.open ?? true;
    return { brand: this.props.brand ?? '#6D4DFF', open, closed: !open };
  }
}
</script>
<script src="js/dc.js"></script>
</body>
</html>
