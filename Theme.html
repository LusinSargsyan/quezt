<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quezt — Theme studio</title>
<meta name="description" content="Quezt — no-code gamification for business. MVP screen: 5 · Theme studio.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@600&display=swap">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600&display=swap">
<link rel="stylesheet" href="quezt.css">
<link rel="stylesheet" href="player.css">
<link rel="stylesheet" href="site.css">

</head>
<body class="page-full">
<a class="skip" href="#qz-root">Skip to content</a>
<div id="qz-root" class="full"></div>
<template id="qz-tpl">

<div class="qz {{theme}}" style="min-height: 1000px; display: flex; flex-wrap: wrap;">
  <div style="flex: 1 1 240px;"><dc-import name="Sidebar" active="theme" dark="{{dark}}" hint-size="100%,1000px"></dc-import></div>
  <main style="flex: 999 1 560px; min-width: 0; padding: 32px; display: flex; flex-direction: column; gap: 24px;">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 4px;"><h1 class="h1">Theme studio</h1><span class="muted">Full branding on every plan, including Free.</span></div>
      <div style="display: flex; gap: 8px; align-items: center;"><span class="caption" style="color: var(--success); display: flex; gap: 4px; align-items: center;"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Saved</span><button class="btn btn-secondary" type="button">Export CSS variables</button></div>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start;">
      <!-- Controls -->
      <section style="flex: 1 1 360px; max-width: 460px; display: flex; flex-direction: column; gap: 20px;" aria-label="Theme settings">
        <div class="card" style="display: flex; flex-direction: column; gap: 12px;">
          <div style="display: flex; flex-direction: column; gap: 2px;"><label class="label" for="url" style="margin: 0;">Import from your website</label><span class="muted" style="font-size: 13px;">Paste any link. We take the logo, colors, font and name.</span></div>
          <div style="display: flex; gap: 8px;">
            <input class="input" id="url" value="{{site}}" placeholder="yourbrand.com" inputmode="url" autocomplete="url" style="flex: 1; min-width: 0;">
            <button class="btn btn-primary" type="button">Import</button>
          </div>
          <template data-sc="if" value="{{imported}}">
            <div style="display: flex; flex-direction: column; gap: 10px; padding-top: 4px; border-top: 1px solid var(--border-default);">
              <div style="display: flex; gap: 12px; align-items: center; padding-top: 10px;">
                <span style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--border-default); background: #fff; display: grid; place-items: center; overflow: hidden; flex: none;"><template data-sc="if" value="{{logo}}"><img src="{{logo}}" alt="{{brandName}} logo" style="max-width: 36px; max-height: 36px; object-fit: contain;"></template><template data-sc="if" value="{{noLogo}}"><span class="caption">logo</span></template></span>
                <span style="display: flex; flex-direction: column; min-width: 0;"><b style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{brandName}}</b><span class="muted" style="font-size: 13px;">{{siteHost}} · Font: {{font}}</span></span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px;">
                <span class="caption">COLORS FROM THE SITE · CLICK TO USE</span>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                  <template data-sc="for" list="{{swatches}}" as="s">
                    <button type="button" class="swatch-btn" aria-label="Use {{s.hex}}" aria-pressed="{{s.on}}" title="{{s.hex}}" style="width: 36px; height: 36px; border-radius: 10px; background: {{s.hex}}; border: 2px solid {{s.ring}}; box-shadow: inset 0 0 0 2px #fff; cursor: pointer; padding: 0;"></button>
                  </template>
                </div>
              </div>
            </div>
          </template>
        </div>

        <div>
          <p class="label">Preset</p>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
            <button class="btn btn-secondary" type="button" style="border: 2px solid var(--accent); background: var(--accent-subtle); color: var(--accent);">Night</button>
            <button class="btn btn-secondary" type="button">Clean</button>
            <button class="btn btn-secondary" type="button">Playful</button>
          </div>
        </div>

        <div class="card" style="display: flex; flex-direction: column; gap: 12px;">
          <label class="label" for="pc" style="margin: 0;">Primary color</label>
          <div style="display: flex; gap: 8px; align-items: center;">
            <span class="swatch" style="background: {{brand}}; width: 40px; height: 40px;"></span>
            <input class="input" id="pc" value="{{brand}}" style="font-family: var(--font-mono);">
          </div>
          <template data-sc="if" value="{{passes}}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; gap: 8px; align-items: center;"><span class="chip chip-live">AA {{ratio}}:1</span><span class="muted">on white. Text on buttons: {{onBrandName}}.</span></div>
          </template>
          <template data-sc="if" value="{{fails}}" hint-placeholder-val="{{ false }}">
            <div class="banner" role="alert" style="padding: 10px 12px;">
              <svg class="icon icon-20" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--danger);"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
              <div style="display: flex; flex-direction: column; gap: 6px;"><b>{{ratio}}:1 on white, needs 4.5:1</b><span class="muted">Players may not read your links and buttons. Use the nearest passing shade:</span><span style="display: flex; gap: 8px; align-items: center;"><span class="swatch" style="background: #B54708;"></span><span class="mono">#B54708</span><button class="btn btn-secondary btn-sm" type="button">Use this shade</button></span></div>
            </div>
          </template>
        </div>

        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
          <div><label class="label" for="font">Font</label><select class="input" id="font"><template data-sc="if" value="{{imported}}"><option selected>{{font}} (from site)</option></template><option>Satoshi (Fontshare)</option><option>General Sans</option><option>Your site font</option></select></div>
          <div><label class="label" for="rad">Corner radius · 20 px</label><input id="rad" type="range" min="0" max="24" value="20" style="width: 100%; height: 40px; accent-color: var(--accent);"></div>
          <div><label class="label" for="mode">Mode</label><select class="input" id="mode"><option>Night</option><option>Clean (light)</option><option>Follow site</option></select></div>
          <div><label class="label" for="pos">Launcher position</label><select class="input" id="pos"><option>Bottom right</option><option>Bottom left</option><option>Inline only</option></select></div>
        </div>

        <div>
          <p class="label">Badge icon style <span class="caption">(one per campaign)</span></p>
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
            <button class="btn btn-secondary" type="button" style="height: 64px; flex-direction: column; gap: 4px; border: 2px solid var(--accent);"><svg class="icon icon-20" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"></path></svg><span class="caption">Style A</span></button>
            <button class="btn btn-secondary" type="button" style="height: 64px; flex-direction: column; gap: 4px;"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0z" fill="currentColor"></path><rect x="11" y="14" width="2" height="5" fill="currentColor"></rect><rect x="8" y="19" width="8" height="2" rx="1" fill="currentColor"></rect></svg><span class="caption">Style B</span></button>
            <button class="btn btn-secondary" type="button" style="height: 64px; flex-direction: column; gap: 4px;"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="var(--accent-subtle)"></circle><path d="M8 7h8v3a4 4 0 0 1-8 0zM10 17h4" stroke="currentColor" stroke-width="1.75" fill="none" stroke-linecap="round"></path></svg><span class="caption">Style C</span></button>
            <button class="btn btn-secondary" type="button" style="height: 64px; flex-direction: column; gap: 4px;"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z" fill="currentColor" opacity=".2"></path><path d="M9 9h6v2a3 3 0 0 1-6 0z" fill="currentColor"></path></svg><span class="caption">Style D</span></button>
          </div>
          <p class="help">Style names TBD (ADR-044).</p>
        </div>
      </section>

      <!-- Preview -->
      <section style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 12px;" aria-label="Live preview">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;"><span class="caption">LIVE PREVIEW · SAMPLE PLAYER (240 XP)</span><div class="seg"><span class="on">Desktop</span><span>Mobile</span></div></div>
        <div style="position: relative; height: 620px; border-radius: 16px; border: 1px solid var(--border-default); background: #f4f3f7; overflow: hidden;">
          <div aria-hidden="true" style="position: absolute; inset: 0; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; justify-content: space-between; align-items: center;"><span style="font-weight: 700; font-size: 12px; color: #5e5b6b;">{{siteHost}}</span><span style="width: 80px; height: 8px; border-radius: 4px; background: #dcd9e4;"></span></div>
            <div style="height: 120px; border-radius: 10px; background: #e2e0e8;"></div>
            <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;"><div style="height: 70px; border-radius: 8px; background: #e9e7ee;"></div><div style="height: 70px; border-radius: 8px; background: #e9e7ee;"></div><div style="height: 70px; border-radius: 8px; background: #e9e7ee;"></div></div>
          </div>
          <div class="qp" style="--qz-w-brand: {{brand}}; --qz-w-on-brand: {{onBrand}}; font-family: {{wfont}}; position: absolute; right: 16px; bottom: 16px; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; background: transparent;">
            <section role="dialog" aria-label="Rewards preview" style="position: relative; width: 340px; max-width: calc(100% - 0px); background: var(--qz-w-surface); border-radius: 24px; box-shadow: var(--shadow-panel); display: flex; flex-direction: column;">
              <span aria-hidden="true" style="position: absolute; right: 40px; bottom: -7px; width: 16px; height: 16px; background: var(--qz-w-surface); transform: rotate(45deg); border-radius: 3px;"></span>
              <header style="display: flex; justify-content: space-between; align-items: center; padding: 12px 10px 6px 16px;">
                <span style="font-weight: 800; font-size: 15px;">{{brandName}} Rewards</span>
                <span style="display: flex; gap: 6px; align-items: center;"><span class="qp-chip qp-chip-xp" style="height: 26px;">1,240 pts</span><span class="qp-icon-btn" aria-hidden="true" style="min-width: 36px; height: 36px; padding: 0;"><svg class="qp-ico" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M6 6l12 12M18 6L6 18"></path></svg></span></span>
              </header>
              <div style="padding: 4px 12px 14px; display: flex; flex-direction: column; gap: 8px;">
                <div class="qp-tabs" style="padding: 3px;"><span class="qp-tab is-on" style="height: 32px; font-size: 13px;">Missions</span><span class="qp-tab" style="height: 32px; font-size: 13px;">Badges</span><span class="qp-tab" style="height: 32px; font-size: 13px;">Ranks</span></div>
                <div style="background: var(--qz-w-brand); color: var(--qz-w-on-brand); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 6px;">
                  <div style="display: flex; justify-content: space-between; align-items: baseline;"><span class="qp-display" style="font-size: 22px; line-height: 26px;">Level 2</span><b class="qp-num" style="font-size: 16px;">240 / 500 XP</b></div>
                  <div style="height: 8px; border-radius: 999px; background: rgba(255,255,255,.22); overflow: hidden;"><span style="display: block; width: 48%; height: 100%; border-radius: 999px; background: var(--qz-w-cta);"></span></div>
                  <span style="opacity: .9; font-size: 13px;">260 XP to Level 3 → coupon</span>
                </div>
                <div class="qp-card qp-row" style="padding: 10px 12px; gap: 8px;"><span style="flex: 1; display: flex; flex-direction: column;"><b style="font-size: 14px;">Play 5 rounds</b><span class="qp-muted" style="font-size: 12px;">3 / 5 · resets at midnight</span></span><span class="qp-chip qp-chip-xp" style="height: 24px;">+50 XP</span></div>
                <div class="qp-card qp-row" style="padding: 10px 12px; gap: 8px;"><span style="flex: 1; display: flex; flex-direction: column;"><b style="font-size: 14px;">Try a new game</b><span class="qp-muted" style="font-size: 12px;">0 / 1</span></span><span class="qp-chip qp-chip-xp" style="height: 24px;">+50 XP</span></div>
                <span class="qp-btn qp-btn-sm" style="margin-top: 2px;">See all rewards</span>
              </div>
            </section>
            <span class="qp-btn qp-btn-brand" style="height: 48px; padding: 0 18px 0 14px; font-size: 14px; box-shadow: var(--shadow-glow);"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>Rewards · 1,240 pts</span>
          </div>
        </div>
        <p class="help" style="margin: 0;">Shown on a sample page. Players open it from the launcher; it never covers your site until they do.</p>
      </section>
    </div>
  </main>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"site":{"editor":"text","default":""},"brandName":{"editor":"text","default":"Your Brand"},"logo":{"editor":"text","default":""},"font":{"editor":"text","default":"Satoshi"},"c2":{"editor":"text","default":""},"c3":{"editor":"text","default":""},"palette":{"editor":"text","default":""},"brand":{"editor":"color","default":"#6D4DFF","options":["#6D4DFF","#0F766E","#1D4ED8","#F59E0B"]},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  lum(hex) {
    const h = (hex || '#6D4DFF').replace('#', '');
    const c = [0, 2, 4].map((i) => parseInt(h.substr(i, 2), 16) / 255).map((v) => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  site(brand) {
    const p = this.props, site = p.site || '';
    const host = site.replace(/^https?:\/\//, '').replace(/\/.*$/, '').replace(/^www\./, '');
    const pal = [].concat(Array.isArray(p.palette) ? p.palette : [], [p.brand, p.c2, p.c3]).filter((h) => /^#[0-9a-f]{6}$/i.test(h || ''));
    const uniq = [...new Set(pal.map((h) => h.toUpperCase()))].slice(0, 8);
    const font = p.font || 'Satoshi';
    return { site, imported: !!site, siteHost: host || 'yourbrand.com', brandName: p.brandName || 'Your Brand', logo: p.logo || '', noLogo: !p.logo, font,
      wfont: '"' + font + '", "Satoshi", "Noto Sans", system-ui, sans-serif',
      swatches: uniq.map((hex) => ({ hex, on: String(hex === (brand || '').toUpperCase()), ring: hex === (brand || '').toUpperCase() ? 'var(--accent)' : 'var(--border-default)' })) };
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const brand = this.props.brand ?? '#6D4DFF';
    const L = this.lum(brand);
    const onWhite = 1.05 / (L + 0.05);
    const onBlack = (L + 0.05) / (0.0 + 0.05);
    const ratio = Math.round(onWhite * 10) / 10;
    const passes = onWhite >= 4.5;
    return {
      dark, theme: dark ? 'dark' : '', brand,
      ratio, passes, fails: !passes,
      onBrand: onWhite >= onBlack ? '#FFFFFF' : '#0F0E17',
      onBrandName: onWhite >= onBlack ? 'white (auto)' : 'near-black (auto)',
      ...this.site(brand)
    };
  }
}
</script>
<script src="dc.js"></script>
<script src="interact.js"></script>
</body>
</html>
