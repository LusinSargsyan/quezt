<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rewards hub — Night</title>
<meta name="description" content="Quezt — no-code gamification for business. MVP screen: W0 · Rewards hub (Night).">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@600&f[]=satoshi@400,500,700,900&f[]=general-sans@500,600&display=swap">
<link rel="stylesheet" href="css/quezt.css">
<link rel="stylesheet" href="css/player.css">
<link rel="stylesheet" href="css/site.css">

</head>
<body class="page-full">
<a class="skip" href="#qz-root">Skip to content</a>
<a class="home-link" href="index.html" aria-label="All Quezt screens"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>All screens</a>
<div id="qz-root" class="full"></div>
<template id="qz-tpl">

<div class="qp" style="--qz-w-brand: {{brand}}; min-height: 1000px; background: var(--qz-w-ground); padding: 16px; display: flex; flex-direction: column; gap: 16px;">

  <!-- Top bar -->
  <header style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
    <div style="display: flex; align-items: center; gap: 10px; min-width: 228px; padding: 0 8px;">
      <span style="width: 40px; height: 40px; border-radius: 12px; border: 2px dashed var(--qz-w-line); display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700;" class="qp-muted">LOGO</span>
      <span style="font-weight: 800; font-size: 18px;">[Your brand] Rewards</span>
    </div>
    <nav aria-label="Quick links" style="display: flex; gap: 8px; flex: 1; flex-wrap: wrap;">
      <a class="qp-icon-btn" href="#"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--qz-w-cta);"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg>Missions</a>
      <a class="qp-icon-btn" href="#"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--qz-w-xp);"><path d="M3 7l4 4 5-7 5 7 4-4-2 12H5z"></path></svg>Level 2</a>
    </nav>
    <div style="display: flex; gap: 8px; align-items: center;">
      <span class="qp-icon-btn" style="padding: 0 14px 0 6px;"><span style="width: 32px; height: 32px; border-radius: 999px; background: var(--qz-w-xp); color: var(--qz-w-on-xp); display: inline-flex; align-items: center; justify-content: center;"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg></span><b class="qp-num" style="font-size: 16px;">1,240</b><span class="qp-muted">pts</span></span>
      <button class="qp-icon-btn" type="button" aria-label="Sound off"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM17 9l4 6M21 9l-4 6"></path></svg></button>
      <button class="qp-icon-btn" type="button" aria-label="Hide rewards"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 6.1A9.8 9.8 0 0 1 12 6c5 0 9 6 9 6a17 17 0 0 1-2.6 3.2M6.3 7.6A17 17 0 0 0 3 12s4 6 9 6a9 9 0 0 0 3.7-.8"></path></svg></button>
      <span class="qp-icon-btn" style="padding: 0 14px 0 6px;"><span style="width: 32px; height: 32px; border-radius: 999px; background: var(--qz-w-tile-magenta); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px;">LF</span>Lucky Fox 42</span>
    </div>
  </header>

  <div style="display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start;">
    <!-- Sidebar -->
    <aside style="flex: 1 1 248px; max-width: 280px; display: flex; flex-direction: column; gap: 12px;" aria-label="Rewards menu">
      <nav style="background: var(--qz-w-surface); border-radius: 24px; padding: 10px; display: flex; flex-direction: column; gap: 8px;">
        <a class="qp-nav is-on" href="#" aria-current="page"><span style="width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.2); display: inline-flex; align-items: center; justify-content: center;"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M3 11l9-7 9 7v9H3z"></path></svg></span>Lobby</a>
        <a class="qp-nav" href="PMissions.html"><span style="width: 28px; height: 28px; border-radius: 8px; background: var(--qz-w-tile-violet); display: inline-flex; align-items: center; justify-content: center;"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg></span><span style="flex: 1;">Missions</span><span class="qp-chip" style="height: 22px;">2</span></a>
      </nav>

      <!-- Promo card -->
      <div style="position: relative; overflow: hidden; background: var(--qz-w-brand); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 10px; min-height: 200px;">
        <svg width="150" height="150" viewBox="0 0 150 150" aria-hidden="true" style="position: absolute; right: -30px; bottom: -30px;"><circle cx="75" cy="75" r="60" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="22"></circle><circle cx="75" cy="75" r="22" fill="var(--qz-w-xp)"></circle></svg>
        <span class="qp-label" style="color: var(--qz-w-on-brand); opacity: .85;">Streak</span>
        <span class="qp-display" style="font-size: 26px; line-height: 30px; max-width: 170px;">Come back tomorrow for day 5</span>
        <a class="qp-btn qp-btn-sm" href="#" style="align-self: flex-start; margin-top: auto; position: relative;">See streak</a>
      </div>

      <nav style="background: var(--qz-w-surface); border-radius: 24px; padding: 10px; display: flex; flex-direction: column; gap: 8px;" aria-label="Rewards">
        <span class="qp-label" style="padding: 8px 10px 2px;">Rewards</span>
        <a class="qp-nav" href="PBadges.html"><span style="width: 28px; height: 28px; border-radius: 8px; background: var(--qz-w-tile-magenta); display: inline-flex; align-items: center; justify-content: center;"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M12 3l7 4v6c0 4-3 7-7 8-4-1-7-4-7-8V7z"></path></svg></span><span style="flex: 1;">Badges</span><span class="qp-chip qp-chip-xp" style="height: 22px;">1 new</span></a>
        <a class="qp-nav" href="#"><span style="width: 28px; height: 28px; border-radius: 8px; background: var(--qz-w-tile-blue); display: inline-flex; align-items: center; justify-content: center;"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M12 3c1 3 4 4 4 8a4 4 0 0 1-8 0c0-2 1-3 1-3 0 2 1.5 3 1.5 3S10 7 12 3z"></path></svg></span>Streaks</a>
        <a class="qp-nav" href="#"><span style="width: 28px; height: 28px; border-radius: 8px; background: var(--qz-w-tile-coral); display: inline-flex; align-items: center; justify-content: center;"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M3 9h18v3H3zM5 12v9h14v-9M12 9v12"></path></svg></span>Coupons</a>
        <a class="qp-nav" href="PLeaderboard.html"><span style="width: 28px; height: 28px; border-radius: 8px; background: var(--qz-w-tile-navy); display: inline-flex; align-items: center; justify-content: center;"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"></path></svg></span>Weekly ranks</a>
        <a class="qp-nav" href="#"><span style="width: 28px; height: 28px; border-radius: 8px; background: var(--qz-w-surface-raised); box-shadow: inset 0 0 0 1.5px var(--qz-w-line); display: inline-flex; align-items: center; justify-content: center;"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6M12 17h.01"></path></svg></span>How it works</a>
      </nav>
      <p class="qp-muted" style="font-size: 12px; text-align: center; padding: 8px;">Rewards by Quezt · XP has no cash value</p>
    </aside>

    <!-- Main -->
    <main style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 24px;">
      <!-- Hero -->
      <section style="position: relative; background: var(--qz-w-brand); color: var(--qz-w-on-brand); border-radius: 32px; padding: 48px; min-height: 340px; overflow: visible;" aria-labelledby="hero-h">
        <div style="position: absolute; inset: 0; border-radius: 32px; overflow: hidden;" aria-hidden="true">
          <svg width="100%" height="100%" viewBox="0 0 900 340" preserveAspectRatio="xMaxYMid slice">
            <circle cx="740" cy="250" r="210" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="44"></circle>
            <circle cx="740" cy="250" r="120" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="26"></circle>
            <circle cx="740" cy="250" r="52" fill="#ffffff" fill-opacity=".1"></circle>
            <circle cx="600" cy="70" r="22" fill="var(--qz-w-xp)"></circle>
            <circle cx="845" cy="60" r="14" fill="var(--qz-w-xp)"></circle>
            <circle cx="560" cy="180" r="10" fill="var(--qz-w-cta)"></circle>
            <rect x="780" y="110" width="70" height="70" rx="20" fill="var(--qz-w-tile-magenta)" transform="rotate(14 815 145)"></rect>
            <rect x="640" y="120" width="54" height="54" rx="16" fill="var(--qz-w-tile-blue)" transform="rotate(-12 667 147)"></rect>
          </svg>
        </div>
        <div style="position: relative; display: flex; flex-direction: column; gap: 16px; max-width: 520px;">
          <span class="qp-label" style="color: var(--qz-w-on-brand); opacity: .85;">Daily mission · resets in 6 h</span>
          <h1 id="hero-h" class="qp-display" style="font-size: 56px; line-height: 60px;">Play 5 rounds today, earn 500 XP</h1>
          <p style="max-width: 360px;">3 of 5 rounds done. Finish the mission and Level 3 unlocks a 10% coupon.</p>
        </div>
        <button class="qp-orb" type="button" aria-label="Claim 500 XP when the mission is done, 3 of 5 rounds" style="position: absolute; left: 50%; bottom: -80px; margin-left: -75px; width: 160px; height: 160px;">
          <svg width="160" height="160" viewBox="0 0 160 160" aria-hidden="true" style="position: absolute; inset: 0;"><circle cx="80" cy="80" r="74" fill="none" stroke="#ffffff" stroke-opacity=".2" stroke-width="6"></circle><circle cx="80" cy="80" r="74" fill="none" stroke="var(--qz-w-cta)" stroke-width="6" stroke-linecap="round" stroke-dasharray="279 465" transform="rotate(-90 80 80)"></circle></svg>
          <svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true" style="width:38px;height:38px"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>
          <span>Claim</span><span style="font-size: 12px; letter-spacing: 0; text-transform: none; opacity: .85;">3 / 5</span>
        </button>
      </section>

      <!-- Other rewards -->
      <section style="display: flex; flex-direction: column; gap: 16px; padding-top: 16px;" aria-labelledby="or-h">
        <h2 id="or-h" class="qp-display" style="font-size: 26px; line-height: 30px;">Other rewards</h2>
        <div style="background: var(--qz-w-surface); border-radius: 28px; padding: 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;">
          <a class="qp-tile-card" href="PMissions.html" aria-label="Daily missions, 2 left today" style="background: var(--qz-w-tile-violet); min-height: 220px;"><span class="qp-tile-art"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true" style="width:32px;height:32px"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg></span><span class="qp-display" style="font-size: 30px; line-height: 32px;">Daily missions</span><span style="font-weight: 600;">2 left today</span></a>
          <a class="qp-tile-card" href="#" aria-label="Streak badges, 4 days" style="background: var(--qz-w-tile-blue); min-height: 220px;"><span class="qp-tile-art"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true" style="width:32px;height:32px"><path d="M12 3c1 3 4 4 4 8a4 4 0 0 1-8 0c0-2 1-3 1-3 0 2 1.5 3 1.5 3S10 7 12 3z"></path></svg></span><span class="qp-display" style="font-size: 30px; line-height: 32px;">Streak badges</span><span style="font-weight: 600;">4 days</span></a>
          <a class="qp-tile-card" href="#" aria-label="Level up, 210 XP to Level 3" style="background: var(--qz-w-tile-navy); min-height: 220px;"><span class="qp-tile-art"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true" style="width:32px;height:32px"><path d="M3 7l4 4 5-7 5 7 4-4-2 12H5z"></path></svg></span><span class="qp-display" style="font-size: 30px; line-height: 32px;">Level up</span><span style="font-weight: 600;">210 XP to Level 3</span></a>
          <a class="qp-tile-card" href="PLeaderboard.html" aria-label="Weekly ranks, you are 14th" style="background: var(--qz-w-surface-raised); min-height: 220px;"><span class="qp-tile-art" style="background: var(--qz-w-xp); color: var(--qz-w-on-xp);"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true" style="width:32px;height:32px"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"></path></svg></span><span class="qp-display" style="font-size: 30px; line-height: 32px;">Weekly ranks</span><span style="font-weight: 600;">You're #14</span></a>
          <a class="qp-tile-card" href="#" aria-label="Level coupons, 1 expires in 5 days" style="background: var(--qz-w-tile-coral); min-height: 220px;"><span class="qp-tile-art"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true" style="width:32px;height:32px"><path d="M3 9h18v3H3zM5 12v9h14v-9M12 9v12"></path></svg></span><span class="qp-display" style="font-size: 30px; line-height: 32px;">Level coupons</span><span style="font-weight: 600;">1 expires in 5 days</span></a>
          <a class="qp-tile-card" href="PBadges.html" aria-label="Badges, 3 of 8, 1 new" style="background: var(--qz-w-tile-magenta); min-height: 220px;"><span class="qp-tile-art"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true" style="width:32px;height:32px"><path d="M12 3l7 4v6c0 4-3 7-7 8-4-1-7-4-7-8V7z"></path></svg></span><span class="qp-display" style="font-size: 30px; line-height: 32px;">Badges</span><span style="font-weight: 600;">3 of 8 · 1 new</span></a>
        </div>
      </section>

      <!-- Missions -->
      <section style="display: flex; flex-direction: column; gap: 16px;" aria-labelledby="ms-h">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;">
          <h2 id="ms-h" class="qp-display" style="font-size: 26px; line-height: 30px;">All missions</h2>
          <a class="qp-btn" href="PMissions.html">View all</a>
        </div>
        <div class="qp-filters" role="group" aria-label="Filter missions">
          <button class="qp-filter" type="button" aria-pressed="true">Today</button>
          <button class="qp-filter" type="button" aria-pressed="false">This week</button>
          <button class="qp-filter" type="button" aria-pressed="false">Done</button>
          <button class="qp-filter" type="button" aria-pressed="false">Locked</button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px;">
          <div class="qp-card" style="display: flex; flex-direction: column; gap: 12px; background: var(--qz-w-surface);">
            <div class="qp-row"><span class="qp-tile"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8z"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column;"><b style="font-size: 16px;">Win 2 rounds</b><span class="qp-muted">Resets in 6 h</span></span><span class="qp-chip qp-chip-xp">+80 XP</span></div>
            <div class="qp-row" style="gap: 8px;"><div class="qp-bar qp-bar-sm" style="flex: 1;"><span style="width: 50%;"></span></div><span style="font-weight: 700; font-size: 12px;">1 / 2</span></div>
          </div>
          <div class="qp-card" style="display: flex; flex-direction: column; gap: 12px; background: var(--qz-w-surface);">
            <div class="qp-row"><span class="qp-tile"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column;"><b style="font-size: 16px;">Try a new game</b><span class="qp-muted">Any game you haven't played</span></span><span class="qp-chip qp-chip-xp">+50 XP</span></div>
            <div class="qp-row" style="gap: 8px;"><div class="qp-bar qp-bar-sm" style="flex: 1;"><span style="width: 3%;"></span></div><span style="font-weight: 700; font-size: 12px;">0 / 1</span></div>
          </div>
          <div class="qp-card" style="display: flex; flex-direction: column; gap: 12px; background: var(--qz-w-surface);">
            <div class="qp-row"><span class="qp-tile" style="background: var(--qz-w-success); color: var(--qz-w-on-xp);"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column;"><b style="font-size: 16px;">Play 5 rounds</b><span class="qp-muted">+50 XP added</span></span><span class="qp-chip qp-chip-done">Done</span></div>
            <div class="qp-row" style="gap: 8px;"><div class="qp-bar qp-bar-sm" style="flex: 1;"><span style="width: 100%;"></span></div><span style="font-weight: 700; font-size: 12px;">5 / 5</span></div>
          </div>
          <div class="qp-card" style="display: flex; flex-direction: column; gap: 12px; background: var(--qz-w-surface);">
            <div class="qp-row"><span class="qp-tile" style="background: var(--qz-w-line); color: var(--qz-w-disabled);"><svg class="qp-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column;"><b style="font-size: 16px; color: var(--qz-w-muted);">Weekend challenge</b><span class="qp-muted">Unlocks at Level 3</span></span><span class="qp-chip" style="background: var(--qz-w-line); color: var(--qz-w-muted);">+200 XP</span></div>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#6D4DFF","options":["#6D4DFF","#2F6FE8","#C93A47","#0F766E"]},"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    return { brand: this.props.brand ?? '#6D4DFF' };
  }
}
</script>
<script src="js/dc.js"></script>
</body>
</html>
